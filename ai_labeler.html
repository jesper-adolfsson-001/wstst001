<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Image Labeler</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --ink: #162033;
      --muted: #5c6676;
      --line: #cbd2dc;
      --line-strong: #7d8999;
      --blue: #2458d3;
      --blue-hover: #1f4fbd;
      --green: #176d53;
      --green-hover: #125a44;
      --shadow: 0 18px 45px rgba(21, 32, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 15px;
    }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header,
    footer {
      padding: 14px 22px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    footer {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .app-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .credit {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-weight: 600;
    }

    .credit-mark {
      width: 26px;
      height: 26px;
      border: 1px solid #c7d7ff;
      border-radius: 50%;
      background: #eef4ff;
      color: var(--blue);
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 800;
    }

    .credit a {
      color: var(--blue);
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .credit a:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: 0;
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 390px) 1fr;
      gap: 18px;
      padding: 18px;
      min-height: 0;
    }

    .controls {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      align-self: start;
    }

    .dropzone {
      min-height: 190px;
      border: 2px dashed var(--line-strong);
      border-radius: 8px;
      background: #f8fafc;
      display: grid;
      place-items: center;
      padding: 18px;
      text-align: center;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .dropzone.is-over {
      border-color: var(--blue);
      background: #eef4ff;
    }

    .drop-title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
    }

    .drop-subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.4;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    button,
    .file-button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--blue);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 13px;
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }

    button:hover,
    .file-button:hover {
      background: var(--blue-hover);
    }

    button.secondary {
      background: #ffffff;
      border-color: var(--line-strong);
      color: var(--ink);
    }

    button.secondary:hover {
      background: #eef1f5;
    }

    button.success {
      background: var(--green);
    }

    button.success:hover {
      background: var(--green-hover);
    }

    button:disabled {
      background: #d5dae2;
      border-color: #d5dae2;
      color: #6f7886;
      cursor: not-allowed;
    }

    input[type="file"] {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .meta {
      margin-top: 14px;
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .preview {
      min-width: 0;
      min-height: 0;
      background: #202733;
      border-radius: 8px;
      border: 1px solid #121924;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .preview-bar {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      background: #ffffff;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
    }

    .preview-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }

    .canvas-wrap {
      min-height: 320px;
      display: grid;
      place-items: center;
      padding: 18px;
      overflow: auto;
      background:
        linear-gradient(45deg, #2a3342 25%, transparent 25%),
        linear-gradient(-45deg, #2a3342 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2a3342 75%),
        linear-gradient(-45deg, transparent 75%, #2a3342 75%);
      background-color: #202733;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }

    canvas {
      max-width: 100%;
      max-height: calc(100vh - 150px);
      width: auto;
      height: auto;
      background: transparent;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    dialog {
      border: 0;
      border-radius: 8px;
      padding: 0;
      color: var(--ink);
      box-shadow: 0 22px 70px rgba(11, 20, 35, 0.32);
      max-width: min(420px, calc(100vw - 32px));
    }

    dialog::backdrop {
      background: rgba(16, 24, 38, 0.38);
    }

    .dialog-content {
      padding: 18px;
      background: #ffffff;
    }

    .dialog-title {
      margin: 0 0 7px;
      font-size: 17px;
      font-weight: 700;
    }

    .dialog-file {
      margin: 0 0 16px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .dialog-actions .cancel {
      grid-column: 1 / -1;
    }

    @media (max-width: 780px) {
      main {
        grid-template-columns: 1fr;
      }

      .preview {
        min-height: 420px;
      }

      .canvas-wrap {
        min-height: 340px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>AI Image Labeler</h1>
    </header>

    <main>
      <section class="controls" aria-label="Image controls">
        <div class="dropzone" id="dropzone">
          <div>
            <p class="drop-title">Drop PNG</p>
            <p class="drop-subtitle">or choose a file</p>
          </div>
        </div>

        <div class="toolbar">
          <label class="file-button" for="fileInput">Choose PNG</label>
          <input id="fileInput" type="file" accept="image/png">
          <button id="generatedButton" type="button" disabled>AI Generated</button>
          <button id="modifiedButton" class="success" type="button" disabled>AI Modified</button>
        </div>

        <div class="meta">
          <div id="status">Ready.</div>
          <div id="fileMeta">No image loaded.</div>
        </div>
      </section>

      <section class="preview" aria-label="Preview">
        <div class="preview-bar">
          <div id="previewName" class="preview-name">Preview</div>
          <button id="downloadAgainButton" class="secondary" type="button" disabled>Download Again</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="canvas" width="1200" height="800"></canvas>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Output is saved by the browser as a downloaded PNG.</span>
      <span class="credit">
        <span class="credit-mark" aria-hidden="true">S</span>
        <span>
          Made by
          <a href="mailto:jesper.adolfsson@ib.scania.com">jesper.adolfsson@ib.scania.com</a>
          at Scania Industrial Batteries AB
        </span>
      </span>
    </footer>
  </div>

  <dialog id="choiceDialog">
    <div class="dialog-content">
      <p class="dialog-title">Choose label</p>
      <p class="dialog-file" id="dialogFileName"></p>
      <div class="dialog-actions">
        <button id="dialogGeneratedButton" type="button">AI Generated</button>
        <button id="dialogModifiedButton" class="success" type="button">AI Modified</button>
        <button id="dialogCancelButton" class="secondary cancel" type="button">Cancel</button>
      </div>
    </div>
  </dialog>

      }
    };

    const state = {
      file: null,
      sourceImage: null,
      sourceBitmap: null,
      labels: {},
      lastKind: null,
      lastOutputName: null
    };

    const dropzone = document.querySelector("#dropzone");
    const fileInput = document.querySelector("#fileInput");
    const generatedButton = document.querySelector("#generatedButton");
    const modifiedButton = document.querySelector("#modifiedButton");
    const downloadAgainButton = document.querySelector("#downloadAgainButton");
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.querySelector("#status");
    const fileMetaEl = document.querySelector("#fileMeta");
    const previewNameEl = document.querySelector("#previewName");
    const choiceDialog = document.querySelector("#choiceDialog");
    const dialogFileName = document.querySelector("#dialogFileName");

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function basenameWithoutPng(name) {
      return name.replace(/\.png$/i, "");
    }

    function outputName(fileName, labelKind) {
      return `${basenameWithoutPng(fileName)}_${LABEL_DATA[labelKind].suffix}.png`;
    }

    function isPngFile(file) {
      return Boolean(file) && (file.type === "image/png" || /\.png$/i.test(file.name));
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("Could not load image."));
        image.src = src;
      });
    }

    async function loadLabels() {
      state.labels.ai_generated = await loadImage(LABEL_DATA.ai_generated.src);
      state.labels.ai_modified = await loadImage(LABEL_DATA.ai_modified.src);
    }

    function setButtonsEnabled(enabled) {
      generatedButton.disabled = !enabled;
      modifiedButton.disabled = !enabled;
      downloadAgainButton.disabled = !(enabled && state.lastKind);
    }

    function showSourcePreview() {
      canvas.width = state.sourceImage.naturalWidth;
      canvas.height = state.sourceImage.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(state.sourceImage, 0, 0);
      previewNameEl.textContent = state.file.name;
    }

    async function useFile(file) {
      if (!isPngFile(file)) {
        setStatus("Choose a PNG image.");
        return;
      }

      state.file = file;
      state.lastKind = null;
      state.lastOutputName = null;
      setButtonsEnabled(false);
      setStatus("Loading image...");

      const objectUrl = URL.createObjectURL(file);
      try {
        const image = await loadImage(objectUrl);
        state.sourceImage = image;
        fileMetaEl.textContent = `${file.name} - ${image.naturalWidth} x ${image.naturalHeight}px`;
        showSourcePreview();
        setButtonsEnabled(true);
        askForLabel();
      } catch (error) {
        setStatus(error.message);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    function askForLabel() {
      if (!state.file) {
        return;
      }

      dialogFileName.textContent = state.file.name;
      if (typeof choiceDialog.showModal === "function") {
        choiceDialog.showModal();
      } else {
        setStatus("Choose a label.");
      }
    }

    function applyLabel(labelKind) {
      if (!state.sourceImage) {
        setStatus("No image loaded.");
        return;
      }

      const label = state.labels[labelKind];
      const imageWidth = state.sourceImage.naturalWidth;
      const imageHeight = state.sourceImage.naturalHeight;
      const margin = Math.max(1, Math.round(imageHeight / 15));
      const labelHeight = margin;
      const labelWidth = Math.round(label.naturalWidth * (labelHeight / label.naturalHeight));
      const x = imageWidth - margin - labelWidth;
      const y = imageHeight - margin - labelHeight;

      if (x < margin || y < 0) {
        setStatus("Image is too small or too narrow for this label.");
        return;
      }

      canvas.width = imageWidth;
      canvas.height = imageHeight;
      ctx.clearRect(0, 0, imageWidth, imageHeight);
      ctx.drawImage(state.sourceImage, 0, 0);
      ctx.drawImage(label, x, y, labelWidth, labelHeight);

      state.lastKind = labelKind;
      state.lastOutputName = outputName(state.file.name, labelKind);
      downloadAgainButton.disabled = false;
      previewNameEl.textContent = state.lastOutputName;
      setStatus(`Created ${state.lastOutputName}`);
      downloadCanvas(state.lastOutputName);
    }

    function downloadCanvas(filename) {
      canvas.toBlob((blob) => {
        if (!blob) {
          setStatus("Could not create PNG download.");
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, "image/png");
    }

    function chooseDialogLabel(labelKind) {
      choiceDialog.close();
      applyLabel(labelKind);
    }

    function handleDroppedFiles(files) {
      const png = Array.from(files).find(isPngFile);
      if (!png) {
        setStatus("Drop a PNG image.");
        return;
      }
      useFile(png);
    }

    dropzone.addEventListener("dragenter", (event) => {
      event.preventDefault();
      dropzone.classList.add("is-over");
    });

    dropzone.addEventListener("dragover", (event) => {
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
      dropzone.classList.add("is-over");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("is-over");
    });

    dropzone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropzone.classList.remove("is-over");
      handleDroppedFiles(event.dataTransfer.files);
    });

    document.body.addEventListener("dragover", (event) => {
      event.preventDefault();
    });

    document.body.addEventListener("drop", (event) => {
      event.preventDefault();
      dropzone.classList.remove("is-over");
      handleDroppedFiles(event.dataTransfer.files);
    });

    fileInput.addEventListener("change", () => {
      useFile(fileInput.files[0]);
      fileInput.value = "";
    });

    generatedButton.addEventListener("click", () => applyLabel("ai_generated"));
    modifiedButton.addEventListener("click", () => applyLabel("ai_modified"));
    downloadAgainButton.addEventListener("click", () => {
      if (state.lastOutputName) {
        downloadCanvas(state.lastOutputName);
      }
    });

    document.querySelector("#dialogGeneratedButton").addEventListener("click", () => {
      chooseDialogLabel("ai_generated");
    });
    document.querySelector("#dialogModifiedButton").addEventListener("click", () => {
      chooseDialogLabel("ai_modified");
    });
    document.querySelector("#dialogCancelButton").addEventListener("click", () => {
      choiceDialog.close();
      setStatus("Ready.");
    });

    loadLabels()
      .then(() => {
        ctx.fillStyle = "#202733";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        setStatus("Ready.");
      })
      .catch((error) => {
        setStatus(error.message);
        setButtonsEnabled(false);
      });
  </script>
